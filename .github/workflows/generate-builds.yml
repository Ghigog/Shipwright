name: generate-builds
on:
  # Fork change: branches-only, so a tag push does not build.
  #
  # This was a bare `push:`, which has no branch or tag filter, so every release tag
  # triggered a full build of a commit the branch run had already built. Measured on
  # 2026-08-12: the seven-sages-v0.2.0 tag ran 80 minutes and produced artifacts nobody
  # downloads - releases attach the branch run's artifacts - and saved its caches under
  # refs/tags/... keys that no later build restores from.
  push:
    branches:
      - '**'
    # Fork change: don't spend a full multi-platform build on prose. Note the one
    # consequence: README.md ships as readme.txt inside the artifact, so a README-only
    # commit won't be reflected until the next build that runs for another reason.
    # (Written out twice rather than shared with a YAML anchor - GitHub Actions does not
    # support anchors or aliases in workflow files.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Fork change: queue instead of killing. hendrikmuhs/ccache-action saves its cache in a
  # POST-JOB step, which a cancelled run never reaches - so cancelling seeded nothing and
  # made every later build colder. Measured 2026-08-12: three pushes inside ten minutes,
  # the first two cancelled at ~3 min each having saved nothing, the third paying full
  # cold cost. Queuing costs CI minutes on a burst and buys back the cache every time.
  cancel-in-progress: false
jobs:

  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Fork change: upstream only populates this from the default branch, so PR builds
        # restore a develop-built cache. This fork never builds develop - generate-builds
        # has only ever run on mod/seven-sages - so nothing ever writes a cache and the hit
        # rate is a flat 0%. Measured on run 31203036793: 1690 compile requests, 1690
        # misses, ~7.8s each, 34.5 min of the 42 min Windows job. Save unconditionally so a
        # branch build seeds the cache that the next branch build restores.
        save: true
        # Fork change: stable key - see the build-linux ccache note.
        key: ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        # Fork change: content-addressed, not per-commit. This folder holds the SDL and
        # libzip source trees whose versions are pinned in this workflow file, so the
        # workflow's own hash is what decides its contents.
        key: ${{ runner.os }}-deps-${{ hashFiles('.github/workflows/generate-builds.yml') }}
        restore-keys: |
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target GenerateSohOtr -j3
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    needs: generate-soh-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Macports
      uses: melusina-org/setup-macports@v1
      with:
        parameters: '.github/macports.yml'
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }} # ccache-macos-{{ timestamp }}
        max-size: "2G"
        evict-old-files: job
        # Fork change: save on any branch - see the note in generate-soh-otr above.
        save: true
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake -j
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-mac
        path: |
          SoH.dmg
          readme.txt

  build-linux:
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Fork change: save on any branch - see the note in generate-soh-otr above.
        save: true
        # Fork change: stable key, matching what build-macos already does. The action
        # appends its own timestamp, so a new entry is minted per run either way - but a
        # per-ref/per-sha key namespaces them so a tag or a new branch starts cold.
        key: ${{ runner.os }}-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        # Fork change: content-addressed, not per-commit. This folder holds the SDL and
        # libzip source trees whose versions are pinned in this workflow file, so the
        # workflow's own hash is what decides its contents.
        key: ${{ runner.os }}-deps-${{ hashFiles('.github/workflows/generate-builds.yml') }}
        restore-keys: |
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Install libzip without crypto
      run: |
        sudo apt-get remove -y libzip-dev
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j3
        (cd build-cmake && cpack -G External)

        mv README.md readme.txt
        mv build-cmake/*.appimage soh.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-linux
        path: |
          soh.appimage
          readme.txt
    - name: Save Cache deps folder
      # Fork change: see the vcpkg/sccache note - never building the default branch means
      # this cache is otherwise never populated.
      #
      # Skipped on an exact hit, for the same reason as the vcpkg save: the key is now
      # content-addressed, so an exact hit means the entry already exists.
      if: always() && steps.restore-cache-deps.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    needs: generate-soh-otr
    runs-on: windows-latest
    permissions:
      contents: read
      # Fork change: needed by the cache-prune step at the end of this job.
      actions: write
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        variant: sccache
        # Fork change: 3G, up from 1G.
        #
        # 1G was set on 2026-08-08 to stop Windows eating the repo's 10 GB cache budget. It
        # worked, and it also made the cache useless: this build issues ~1701 compile
        # requests whose cached output is ~1.9 GB, so sccache filled to the cap mid-build
        # and evicted the entries the next run needed. Every Windows run from that change
        # onward reported the same thing - restored ~1 GB successfully, then:
        #
        #   Compile requests 1701 / Cache hits 0 / Cache hits rate 0.00 %
        #   Cache size 1023 MiB / Max cache size 1 GiB
        #
        # Verified identical on runs 31288117697, 31332403414, 31626965628 and 31630304255:
        # a cache that is smaller than one build's working set costs a ~1 GB upload and
        # download per run and returns nothing. The budget is protected by the prune step
        # at the end of this job instead, which is the right lever - number of retained
        # entries, not a cap below the working set.
        max-size: "3G"
        evict-old-files: job
        # Fork change: save on any branch - see the note in generate-soh-otr above.
        save: true
        # Fork change: a STABLE key, matching what build-macos already does.
        #
        # This was ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}, which can never
        # hit its own key and mints a fresh cache entry per commit. On Windows that entry is
        # ~1.9 GB - roughly 15x the macOS and Linux ones - so a few commits filled the repo's
        # 10 GB cache budget by themselves, GitHub began evicting least-recently-used entries,
        # and the prefix fallback kept restoring a stale cache. Measured 2026-08-08: 9.98 GB
        # used across 28 entries, sccache-Windows alone 5.69 GB of it, and a run touching two
        # .cpp files still took 14.2 min against Linux 2.8 and macOS 4.9.
        #
        # One reused entry instead, and max-size below drops to 1G so a single platform cannot
        # eat the whole budget again.
        key: ${{ runner.os }}-sccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        # Fork change: key on the thing that decides the contents, not on the commit.
        #
        # This was ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}, which can never
        # hit its own key and mints a fresh ~406 MB entry on every single run - 6 entries and
        # 2.4 GB of the 10 GB budget as of 2026-08-12, for a directory whose contents only
        # change when the package list in CMakeLists.txt does. Now one entry per package list.
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build SoH
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/soh-windows.zip -DestinationPath soh-windows
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows
        path: soh-windows
    - name: Save Cache VCPKG folder
      # Fork change: same reason as the sccache save above - this fork never builds the
      # default branch, so gating on it means the vcpkg cache is never written and every
      # run pays the restore miss.
      #
      # Skipped on an exact hit: the key is now content-addressed, so an exact hit means
      # this entry already exists and re-saving it would fail on the duplicate key.
      if: always() && steps.restore-cache-vcpkg.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg

    - name: Prune old sccache entries
      # Fork change: keep the budget under control by entry count rather than by capping
      # the cache below one build's working set, which is what made it useless before.
      #
      # hendrikmuhs/ccache-action appends a timestamp to its key by design (append-timestamp
      # defaults to true), so every run mints a NEW entry and restores the newest by prefix.
      # Nothing ever deletes the old ones. At ~2-3 GB per Windows entry that fills the repo's
      # 10 GB budget within a few runs, and GitHub then evicts least-recently-used entries -
      # which are the other platforms' caches and vcpkg, not this one. Measured 2026-08-12
      # before this step existed: 9.5 GB across 37 entries, Windows sccache 4.99 GB of it.
      #
      # Keep the two most recent: the one this run just saved, and its predecessor as a
      # fallback if this run's save was incomplete.
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
          --jq '.actions_caches[] | select(.key | startswith("sccache-Windows-")) | "\(.created_at)\t\(.id)"' \
          | sort -r | tail -n +3 | cut -f2 | while read -r id; do
              echo "Deleting stale sccache entry $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
            done
